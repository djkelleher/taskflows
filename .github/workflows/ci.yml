name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format
        run: uvx ruff format --check .
      - name: Install type-check dependencies
        run: uv sync --no-sources --all-extras
      - name: mypy portable scheduler (required)
        run: uv run --no-sources mypy taskflows/scheduler taskflows/admin/models.py
      - name: mypy full project (advisory legacy backlog)
        continue-on-error: true
        run: uv run --no-sources mypy taskflows

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --no-sources --all-extras
      - name: Run unit tests
        run: uv run --no-sources pytest -m "not integration" --timeout=120

  portable-scheduler:
    name: Portable scheduler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install scheduler and API test dependencies
        run: uv sync --no-sources --extra server
      - name: Exercise persistence, dispatch, process control, CLI, and installers
        run: >-
          uv run --no-sources pytest
          tests/test_scheduler.py
          tests/test_entrypoints.py
          tests/test_import_hygiene.py
          --timeout=120
      - name: Exercise the real native daemon lifecycle
        if: runner.os != 'Linux'
        shell: bash
        env:
          TASKFLOWS_DATA_DIR: ${{ runner.temp }}/taskflows-native-lifecycle
        run: |
          cleanup() { uv run --no-sources tf scheduler uninstall --timeout 30s || true; }
          trap cleanup EXIT
          uv run --no-sources tf scheduler ensure --timeout 30s
          uv run --no-sources tf scheduler ensure --timeout 30s
          uv run --no-sources tf scheduler status
          uv run --no-sources tf scheduler restart --timeout 30s
          uv run --no-sources tf scheduler stop --timeout 30s
          uv run --no-sources tf scheduler ensure --timeout 30s

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: uv build
      - name: Install wheel into a clean venv and smoke test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import taskflows; taskflows.Alerts; taskflows.RestartPolicy"
          /tmp/smoke/bin/tf --help

  # systemd user-session tests; advisory until they prove stable on hosted runners
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Enable systemd user session
        run: sudo loginctl enable-linger "$(whoami)" || true
      - name: Install dependencies
        run: uv sync --no-sources --all-extras
      - name: Run integration tests
        # Hosted runners do not provide a systemd user session/DBus. Keep the
        # results visible without making this advisory suite fail the check.
        continue-on-error: true
        run: uv run --no-sources pytest -m integration --timeout=300

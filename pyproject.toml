[project]
name = "taskflows"
version = "0.20.0"
description = "Cross-platform scheduled tasks and Linux systemd services with observability"
authors = [
    {name = "Dan Kelleher",email = "kelleherjdan@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11,<4.0"
dependencies = [
    # execution + systemd + docker core
    "anyio>=4.0.0,<5.0.0",
    "aiohttp>=3.12.15,<4.0.0",
    "aiosmtplib>=4.0.1,<5.0.0",
    "async-lru>=2.0.5,<3.0.0",
    "cloudpickle>=3.1.1,<4.0.0",
    "dbus-next>=0.2.3,<0.3.0",
    "docker>=7.1.0,<8.0.0",
    "dominate>=2.9.1,<3.0.0",
    "emoji>=2.14.1,<3.0.0",
    "imgkit>=1.2.3,<2.0.0",
    "prettytable>=3.16.0,<4.0.0",
    "pydantic>=2.11.9,<3.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    # CLI + rendering + remote-server calls
    "click>=8.2.1,<9.0.0",
    "requests>=2.32.5,<3.0.0",
    "rich>=14.1.0,<15.0.0",
    "slack-sdk>=3.36.0,<4.0.0",
    "toolz>=1.0.0,<2.0.0",
    # logging / metrics
    "loguru>=0.7.3,<0.8.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "structlog>=25.4.0,<26.0.0",
    "xxhash>=3.5.0,<4.0.0",
    # service discovery
    "dynamic-imports>=1.1.1,<2.0.0",
    "apscheduler>=3.11.0,<4.0.0",
    "pywin32>=311 ; sys_platform == 'win32'",
    "sqlalchemy>=2.0.0,<3.0.0",
    # Windows does not ship an IANA time-zone database for zoneinfo.
    "tzdata>=2025.2",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.116.1,<0.117.0",
    "passlib[argon2,bcrypt]>=1.7.4,<2.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "starlette>=0.40.0,<0.49.0",
    "uvicorn>=0.35.0,<0.36.0",
]
grafana = [
    "grafanalib>=0.7.1,<0.8.0",
]
aws = [
    "boto3>=1.34.0,<2.0.0",
]
pulumi = [
    "pulumi>=3.100.0,<4.0.0",
    "pulumi-aws>=6.20.0,<8.0.0",
]
cloud = [
    "taskflows[aws,pulumi]",
]
all = [
    "taskflows[server,grafana,cloud]",
]

[project.scripts]
tf = "taskflows.admin.cli:cli"
_taskflows_scheduler = "taskflows.scheduler.daemon:main"
_start_srv_api = "taskflows.admin.api:_start_api_cmd"
_run_docker_service = "taskflows.exec:_run_docker_service"
_deserialize_and_call = "taskflows.exec:_deserialize_and_call"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=4.0,<5.0",
    "pytest-timeout>=2.0,<3.0",
    "pytest-xdist>=3.0,<4.0",
    "hypothesis>=6.0,<7.0",
    "mypy>=1.8.0,<2.0.0",
    "types-requests",
    "httpx",
    "moto>=5.1.19,<6.0.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# TYPE_CHECKING re-exports backing the lazy (PEP 562) public API
"taskflows/__init__.py" = ["F401"]
# Preserve the control-flow structure of the restored alert renderer/send paths.
"taskflows/alerts/*.py" = ["SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter-declaration idiom uses calls in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "taskflows.exceptions",
    "taskflows.constants",
    "taskflows.security_validation",
    "taskflows.admin.models",
]
disallow_untyped_defs = true
disallow_untyped_calls = true

[[tool.mypy.overrides]]
module = ["taskflows.admin.utils", "taskflows.metrics"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "cloudpickle.*",
    "apscheduler.*",
    "dbus_next.*",
    "docker.*",
    "dynamic_imports.*",
    "grafanalib.*",
    "xxhash.*",
    "win32com.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests requiring systemd",
    "security: security-focused tests",
]


[tool.hatch.build]
# Built web UI copied to taskflows/admin/static by the release workflow;
# gitignored, so it must be declared as a build artifact to ship in the wheel.
artifacts = ["taskflows/admin/static/"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/taskflows",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["taskflows"]


[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
